<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuanLauncher - Autenticación</title>
    <meta name="description" content="Inicia sesión o regístrate en JuanLauncher para descargar juegos.">
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="shortcut icon" href="img/juanlauncher/logo-favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">
    <div class="auth-overlay"></div>

    <div class="auth-wrapper">
        <div class="auth-form-container" id="authContainer">
            
            <!-- Formulario de Inicio de Sesión -->
            <div class="auth-form">
                <h1 class="auth-title">Iniciar Sesión</h1>
                <!-- Le ponemos un ID al form para controlarlo mejor con JS -->
                <form id="form-login">
                    <div class="auth-input-group">
                        <label for="login-email">Usuario o Correo</label>
                        <!-- CAMBIO MENOR: type="text" en vez de email para que te deje escribir "admin" -->
                        <input type="text" id="login-email" placeholder="Usuario o correo..." required autocomplete="off">
                    </div>
                    <div class="auth-input-group">
                        <label for="login-pass">Contraseña</label>
                        <input type="password" id="login-pass" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="auth-btn">Ingresar</button>
                    
                    <p class="auth-switch">¿No tienes cuenta? <span onclick="toggleAuth()">Regístrate</span></p>
                </form>
            </div>

            <!-- Formulario de Registro -->
            <div class="auth-form">
                <h1 class="auth-title">Registro</h1>
                <form id="form-register">
                    <div class="auth-input-group">
                        <label for="reg-name">Nombre de Usuario</label>
                        <input type="text" id="reg-name" placeholder="GamerPro123" required>
                    </div>
                    <div class="auth-input-group">
                        <label for="reg-email">Correo Electrónico</label>
                        <input type="email" id="reg-email" placeholder="tulogin@correo.com" required>
                    </div>
                    <div class="auth-input-group">
                        <label for="reg-pass">Contraseña</label>
                        <input type="password" id="reg-pass" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="auth-btn">Crear Cuenta</button>
                    
                    <p class="auth-switch">¿Ya tienes cuenta? <span onclick="toggleAuth()">Iniciar Sesión</span></p>
                </form>
            </div>
            
        </div>

        <a href="index.html" class="auth-back">Volver al inicio</a>
    </div>

    <script>
       // Animación de tu amigo
        function toggleAuth() {
            document.getElementById('authContainer').classList.toggle('slide-register');
        }

         // --------------------------------------------------------
        // SISTEMA DE SEGURIDAD SIMPLIFICADO PARA PRUEBAS LOCALES
        // --------------------------------------------------------
        document.getElementById('form-login').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const user = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            // Si intenta acceder como admin...
            if (user === "admin") {
                // Validación directa para evitar el bloqueo local
                if (pass === "Juancho2026") {
                    // ¡Contraseña correcta! Entra al Dashboard
                    sessionStorage.setItem('admin_token', 'autorizado_juanlauncher_2026');
                    // Usamos un pequeño truco para asegurar la redirección
                    setTimeout(() => {
                        window.location.assign('dashboard.html');
                    }, 100);
                } else {
                    alert("Credenciales incorrectas.");
                }
            } else {
                // LOGIN DE USUARIOS NORMALES
                localStorage.setItem("isLoggedIn", "true");
                let nombreDisplay = user.split('@')[0];
                localStorage.setItem("userName", nombreDisplay); 
                window.location.href = "comunidad.html";
            }
        });

    


        // Lógica del Registro (El mock que hizo tu amigo)
        document.getElementById('form-register').addEventListener('submit', function(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value;
            
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("userName", name);
            window.location.href = "comunidad.html";
        });
    </script>
</body>

</html>
